[project]
name = "agronom"
version = "0.1.0"
description = "Agronom - agricultural field management"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "shapely>=2.0",
    "pyproj>=3.6",
    "alembic>=1.13",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["shapely.*", "pyproj.*", "geoalchemy2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
