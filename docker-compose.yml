services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: agronom
      POSTGRES_PASSWORD: agronom
      POSTGRES_DB: agronom
    ports:
      - "5432:5432"
    volumes:
      - agronom-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agronom -d agronom"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://agronom:agronom@db:5432/agronom
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  agronom-db-data:
